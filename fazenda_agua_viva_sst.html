<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a3a2a">
<title>SST — Fazenda Água Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--gd:#1a3a2a;--gm:#2d6a4f;--gl:#40916c;--gp:#d8f3dc;--ap:#fef3c7;--bp:#dbeafe;--rp:#fee2e2;--text:#1a1a1a;--t2:#4b5563;--t3:#9ca3af;--bg:#f0f4f0;--card:#fff;--bdr:#e0e8e2;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.header{background:var(--gd);padding:16px 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.hlogo{width:36px;height:36px;background:var(--gl);border-radius:10px;display:flex;align-items:center;justify-content:center}
.hlogo i{font-size:20px;color:#fff}
.htitle h1{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.htitle p{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.hbell{position:relative;cursor:pointer}
.hbell i{font-size:22px;color:rgba(255,255,255,.8)}
.bell-b{position:absolute;top:-4px;right:-4px;background:#c1440e;color:#fff;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bdr);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;gap:3px;cursor:pointer;color:var(--t3);font-size:10px;border:none;background:none}
.nav-item i{font-size:22px}
.nav-item.active{color:var(--gm)}
.page{display:none;padding:14px 14px 0}
.page.active{display:block}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.metric{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--bdr)}
.metric-label{font-size:11px;color:var(--t3);margin-bottom:6px;font-weight:500}
.metric-val{font-size:28px;font-weight:700;font-family:'Sora',sans-serif}
.metric-val.green{color:var(--gm)}.metric-val.red{color:#c1440e}.metric-val.amber{color:#d97706}
.metric-sub{font-size:11px;color:var(--t3);margin-top:2px}
.alert-banner{border-radius:10px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;border:1px solid}
.alert-banner.red{background:var(--rp);border-color:#fca5a5}
.alert-banner.amber{background:var(--ap);border-color:#fcd34d}
.alert-banner i{font-size:18px;flex-shrink:0;margin-top:1px}
.alert-banner.red i,.alert-banner.red .abt{color:#991b1b}
.alert-banner.amber i,.alert-banner.amber .abt{color:#92400e}
.abt{font-size:12px;line-height:1.4}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);margin-bottom:12px;overflow:hidden}
.card-header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:'Sora',sans-serif;font-size:14px;font-weight:700}
.sec-title{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:var(--t2);margin-bottom:10px;margin-top:4px;display:flex;align-items:center;gap:6px}
.sec-title i{font-size:16px;color:var(--gm)}
.list-item{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:10px}
.list-item:last-child{border-bottom:none}
.li-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.av-g{background:var(--gp);color:var(--gd)}.av-b{background:var(--bp);color:#1e40af}.av-a{background:var(--ap);color:#92400e}
.li-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11px;color:var(--t3);margin-top:1px}
.li-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--bdr);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2)}
.icon-btn i{font-size:16px}
.icon-btn.danger{border-color:#fca5a5;color:#c1440e}
.icon-btn.zap{border-color:#25d366;color:#25d366}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.green{background:var(--gp);color:var(--gd)}.badge.red{background:var(--rp);color:#991b1b}.badge.amber{background:var(--ap);color:#92400e}.badge.blue{background:var(--bp);color:#1e40af}
.btn{padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--gm);color:#fff;width:100%}
.btn.cancel{background:var(--bg);color:var(--t2)}
.btn.zapsign{background:#25d366;color:#fff;width:100%;font-size:13px;padding:11px}
.btn.sheets{background:#0f9d58;color:#fff;width:100%;font-size:13px;padding:11px}
.fab{position:fixed;bottom:90px;right:18px;width:54px;height:54px;border-radius:50%;background:var(--gm);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(45,106,79,.35);z-index:99}
.fab i{font-size:26px}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid var(--bdr);background:#fff;color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:var(--gd);color:#fff;border-color:var(--gd)}
.search-wrap{padding:0 14px 10px}
.search-inner{position:relative}
.search-input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--bdr);border-radius:10px;font-size:14px;background:#fff;color:var(--text)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:18px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:20px 18px 32px}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 18px}
.modal-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:5px;display:block}
.form-input{width:100%;padding:11px 13px;border:1px solid var(--bdr);border-radius:10px;font-size:14px;color:var(--text);background:#fff;appearance:none}
.form-input:focus{outline:none;border-color:var(--gm)}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;gap:10px;margin-top:20px}
.modal-footer .btn{flex:1}
.alert-item{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;gap:10px}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert-dot.red{background:var(--rp)}.alert-dot.amber{background:var(--ap)}
.alert-dot.red i{color:#c1440e}.alert-dot.amber i{color:#d97706}
.alert-msg{font-size:12px;line-height:1.5}
.alert-type{font-size:10px;color:var(--t3);margin-top:2px}
.config-card{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);padding:16px;margin-bottom:12px}
.config-title{font-family:'Sora',sans-serif;font-size:14px;font-weight:700;margin-bottom:6px}
.config-desc{font-size:12px;color:var(--t3);margin-bottom:12px;line-height:1.5}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.status-dot.green{background:#22c55e}.status-dot.red{background:#ef4444}.status-dot.amber{background:#f59e0b}
.empty{text-align:center;padding:32px 20px;color:var(--t3)}
.empty i{font-size:40px;display:block;margin-bottom:10px;color:#ccc}
.empty p{font-size:13px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;display:none;white-space:nowrap}
.toast.show{display:block;animation:fin .2s,fout .3s 2.5s forwards}
@keyframes fin{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fout{to{opacity:0}}
.sync-indicator{font-size:11px;display:flex;align-items:center;gap:4px;color:var(--t3);padding:4px 0}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="hlogo"><i class="ti ti-leaf"></i></div>
    <div class="htitle"><h1>Fazenda Água Viva</h1><p>Saúde e Segurança do Trabalho</p></div>
  </div>
  <div class="hbell" onclick="showPage('alertas')">
    <i class="ti ti-bell"></i>
    <div class="bell-b" id="bell-count" style="display:none">0</div>
  </div>
</div>

<div id="page-dashboard" class="page active"></div>
<div id="page-funcionarios" class="page"></div>
<div id="page-exames" class="page"></div>
<div id="page-epi" class="page"></div>
<div id="page-mais" class="page"></div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard"><i class="ti ti-layout-dashboard"></i><span>Início</span></button>
  <button class="nav-item" onclick="showPage('funcionarios')" id="nav-funcionarios"><i class="ti ti-users"></i><span>Equipe</span></button>
  <button class="nav-item" onclick="showPage('exames')" id="nav-exames"><i class="ti ti-stethoscope"></i><span>Exames</span></button>
  <button class="nav-item" onclick="showPage('epi')" id="nav-epi"><i class="ti ti-shield-check"></i><span>EPI</span></button>
  <button class="nav-item" onclick="showPage('mais')" id="nav-mais"><i class="ti ti-dots"></i><span>Mais</span></button>
</nav>

<button class="fab" id="fab-btn" onclick="openFab()" style="display:none"><i class="ti ti-plus"></i></button>

<!-- MODAL FUNCIONÁRIO -->
<div class="modal-overlay" id="modal-func">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="mfunc-title">Novo funcionário</div>
    <input type="hidden" id="func-id">
    <div class="form-group"><label class="form-label">Nome completo *</label><input class="form-input" id="func-nome" placeholder="Nome do funcionário"></div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Matrícula</label><input class="form-input" id="func-mat" placeholder="001"></div>
      <div class="form-group"><label class="form-label">Situação</label>
        <select class="form-input" id="func-sit"><option>Ativo</option><option>Afastado</option><option>Férias</option></select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Cargo / Função</label><input class="form-input" id="func-cargo" placeholder="Ex: Tratorista, Ordenhador..."></div>
    <div class="form-group"><label class="form-label">Setor</label>
      <select class="form-input" id="func-setor">
        <option value="">Selecione...</option>
        <option>Lavoura</option><option>Pecuária</option><option>Ordenha</option>
        <option>Manutenção</option><option>Administrativo</option><option>Outro</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Data de admissão</label><input class="form-input" type="date" id="func-admissao"></div>
    <div class="form-group"><label class="form-label">WhatsApp (com DDD)</label><input class="form-input" type="tel" id="func-whats" placeholder="61999990000"></div>
    <div class="modal-footer">
      <button class="btn cancel" onclick="closeModal('modal-func')">Cancelar</button>
      <button class="btn primary" onclick="saveFuncionario()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL EXAME -->
<div class="modal-overlay" id="modal-exame">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Registrar exame médico</div>
    <input type="hidden" id="exame-id">
    <div class="form-group"><label class="form-label">Funcionário *</label><select class="form-input" id="exame-func"></select></div>
    <div class="form-group"><label class="form-label">Tipo de exame</label>
      <select class="form-input" id="exame-tipo">
        <option>Admissional</option><option>Periódico</option><option>Retorno ao trabalho</option>
        <option>Mudança de função</option><option>Demissional</option>
      </select>
    </div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Data de realização</label><input class="form-input" type="date" id="exame-data"></div>
      <div class="form-group"><label class="form-label">Válido até</label><input class="form-input" type="date" id="exame-val"></div>
    </div>
    <div class="form-group"><label class="form-label">Resultado</label>
      <select class="form-input" id="exame-resultado"><option>Apto</option><option>Apto com restrição</option><option>Inapto</option></select>
    </div>
    <div class="form-group"><label class="form-label">Médico / CRM</label><input class="form-input" id="exame-medico" placeholder="Dr. Nome / CRM 00000"></div>
    <div class="modal-footer">
      <button class="btn cancel" onclick="closeModal('modal-exame')">Cancelar</button>
      <button class="btn primary" onclick="saveExame()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL EPI -->
<div class="modal-overlay" id="modal-epi">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Registrar entrega de EPI</div>
    <input type="hidden" id="epi-id">
    <div class="form-group"><label class="form-label">Funcionário *</label><select class="form-input" id="epi-func"></select></div>
    <div class="form-group"><label class="form-label">EPI</label>
      <select class="form-input" id="epi-tipo">
        <option>Capacete</option><option>Óculos de proteção</option><option>Luvas</option>
        <option>Protetor auricular</option><option>Bota de segurança</option>
        <option>Cinto de segurança</option><option>Máscara respiratória</option>
        <option>Colete refletivo</option><option>Avental</option><option>Outro</option>
      </select>
    </div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">CA nº</label><input class="form-input" id="epi-ca" placeholder="CA"></div>
      <div class="form-group"><label class="form-label">Quantidade</label><input class="form-input" type="number" id="epi-qtd" value="1" min="1"></div>
    </div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Data de entrega</label><input class="form-input" type="date" id="epi-data"></div>
      <div class="form-group"><label class="form-label">Próx. reposição</label><input class="form-input" type="date" id="epi-rep"></div>
    </div>
    <div style="background:var(--gp);border-radius:10px;padding:10px 12px;margin-bottom:4px;display:flex;align-items:flex-start;gap:8px">
      <i class="ti ti-brand-whatsapp" style="font-size:18px;color:var(--gm);flex-shrink:0;margin-top:1px"></i>
      <p style="font-size:12px;color:var(--gd);line-height:1.4">Ao salvar, o link de assinatura será enviado automaticamente pelo WhatsApp do funcionário via ZapSign.</p>
    </div>
    <div class="modal-footer">
      <button class="btn cancel" onclick="closeModal('modal-epi')">Cancelar</button>
      <button class="btn primary" onclick="saveEpi()">Salvar e enviar</button>
    </div>
  </div>
</div>

<!-- MODAL TREINAMENTO -->
<div class="modal-overlay" id="modal-trein">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Registrar treinamento</div>
    <input type="hidden" id="trein-id">
    <div class="form-group"><label class="form-label">Funcionário *</label><select class="form-input" id="trein-func"></select></div>
    <div class="form-group"><label class="form-label">Treinamento / NR</label>
      <select class="form-input" id="trein-tipo">
        <option>NR-6 (EPI)</option><option>NR-10 (Eletricidade)</option><option>NR-12 (Máquinas)</option>
        <option>NR-18 (Construção)</option><option>NR-31 (Agricultura)</option>
        <option>NR-35 (Trabalho em altura)</option><option>CIPA</option>
        <option>Brigada de incêndio</option><option>Primeiros socorros</option><option>Outro</option>
      </select>
    </div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Data de realização</label><input class="form-input" type="date" id="trein-data"></div>
      <div class="form-group"><label class="form-label">Válido até</label><input class="form-input" type="date" id="trein-val"></div>
    </div>
    <div class="form-group"><label class="form-label">Carga horária</label><input class="form-input" id="trein-ch" placeholder="Ex: 8h"></div>
    <div class="modal-footer">
      <button class="btn cancel" onclick="closeModal('modal-trein')">Cancelar</button>
      <button class="btn primary" onclick="saveTrein()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL CONFIGURAÇÕES -->
<div class="modal-overlay" id="modal-config">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Configurações</div>
    <div class="form-group">
      <label class="form-label">API Key ZapSign</label>
      <input class="form-input" id="cfg-zapkey" placeholder="Sua API Key do ZapSign" type="password">
    </div>
    <div class="form-group">
      <label class="form-label">Token do template EPI (ZapSign)</label>
      <input class="form-input" id="cfg-zaptoken" placeholder="Token do template de EPI">
    </div>
    <div class="form-group">
      <label class="form-label">URL do Apps Script (Google Sheets)</label>
      <input class="form-input" id="cfg-sheets" placeholder="https://script.google.com/...">
    </div>
    <div class="modal-footer">
      <button class="btn cancel" onclick="closeModal('modal-config')">Cancelar</button>
      <button class="btn primary" onclick="saveConfig()">Salvar configurações</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const K={f:'fav-func',e:'fav-exame',p:'fav-epi',t:'fav-trein',cfg:'fav-config'};
const SHEETS_URL='https://script.google.com/macros/s/AKfycbz9ZWJSx9zIQksxWFhpf_MORrRvUG8yi6eK3VR9B4cmSGK8shP3b9z8sGAo1jGZWmgV/exec';

const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}};
const loadObj=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return{}}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().split('T')[0];
const daysUntil=d=>d?Math.ceil((new Date(d)-new Date(today()))/86400000):9999;
const fmtD=d=>{if(!d)return'-';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`};
const initials=n=>n?n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase():'?';
const avColor=n=>{const c=['av-g','av-b','av-a'];return c[(n||'').charCodeAt(0)%3]};

function statusOf(val){
  const d=daysUntil(val);
  if(d<0)return{cls:'red',txt:'Vencido'};
  if(d<=30)return{cls:'amber',txt:`${d}d`};
  return{cls:'green',txt:'Em dia'};
}

function toast(msg,dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show';
  setTimeout(()=>t.className='toast',dur);
}

// ── CONFIG ──
function getConfig(){return loadObj(K.cfg)}
function saveConfig(){
  const cfg={
    zapKey:document.getElementById('cfg-zapkey').value.trim(),
    zapToken:document.getElementById('cfg-zaptoken').value.trim(),
    sheetsUrl:document.getElementById('cfg-sheets').value.trim()||SHEETS_URL
  };
  save(K.cfg,cfg);
  closeModal('modal-config');
  toast('Configurações salvas!');
  renderMais();
}
function openConfig(){
  const cfg=getConfig();
  document.getElementById('cfg-zapkey').value=cfg.zapKey||'';
  document.getElementById('cfg-zaptoken').value=cfg.zapToken||'';
  document.getElementById('cfg-sheets').value=cfg.sheetsUrl||SHEETS_URL;
  openModal('modal-config');
}

// ── SHEETS SYNC ──
async function syncSheets(sheet,data){
  const cfg=getConfig();
  const url=cfg.sheetsUrl||SHEETS_URL;
  try{
    // Usa GET com parâmetro para evitar problema de CORS com Apps Script
    const payload=JSON.stringify({sheet,data});
    const encoded=encodeURIComponent(payload);
    await fetch(`${url}?data=${encoded}`,{method:'GET',mode:'no-cors'});

// ── ZAPSIGN ──
async function enviarZapSign(epi,func){
  const cfg=getConfig();
  if(!cfg.zapKey||!cfg.zapToken){
    toast('Configure a API Key e Token do ZapSign nas configurações.');
    return false;
  }
  if(!func.whats){
    toast('Funcionário sem WhatsApp cadastrado.');
    return false;
  }
  try{
    const payload={
      sandbox:false,
      template_id:cfg.zapToken,
      signers:[{
        name:func.nome,
        email:'',
        phone_country:'55',
        phone_number:func.whats,
        send_automatic_whatsapp:true,
        auth_mode:'whatsapp'
      }],
      data:[
        {de:'funcionario',para:func.nome},
        {de:'cargo',para:func.cargo||''},
        {de:'epi',para:epi.tipo},
        {de:'ca',para:epi.ca||''},
        {de:'quantidade',para:String(epi.qtd||1)},
        {de:'data_entrega',para:fmtD(epi.data)}
      ]
    };
    const res=await fetch('https://api.zapsign.com.br/api/v1/docs/create-from-template/',{
      method:'POST',
      headers:{'Authorization':`Bearer ${cfg.zapKey}`,'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(res.ok){toast('ZapSign: link enviado no WhatsApp!');return true;}
    else{toast('Erro no ZapSign. Verifique as configurações.');return false;}
  }catch(e){
    toast('Não foi possível conectar ao ZapSign.');
    return false;
  }
}

    <div class="metric"><div class="metric-label">Exames vencidos</div><div class="metric-val ${exVenc>0?'red':'green'}">${exVenc}</div><div class="metric-sub">${exAlert} a vencer em 30d</div></div>
    <div class="metric"><div class="metric-label">EPI pendente</div><div class="metric-val ${epiPend>0?'amber':'green'}">${epiPend}</div><div class="metric-sub">reposição até 30d</div></div>
    <div class="metric"><div class="metric-label">Treinamentos</div><div class="metric-val ${trVenc>0?'red':'green'}">${trVenc}</div><div class="metric-sub">vencidos</div></div>
  </div>`;

  const urgentes=[
    ...exames.filter(e=>daysUntil(e.val)<=30).map(e=>({...e,modulo:'Exame',valStr:e.val,d:daysUntil(e.val),nome:getName(e.funcId)})),
    ...epis.filter(e=>daysUntil(e.rep)<=30).map(e=>({...e,modulo:'EPI',valStr:e.rep,d:daysUntil(e.rep),nome:getName(e.funcId)})),
    ...treins.filter(t=>daysUntil(t.val)<=30).map(t=>({...t,modulo:'Treinamento',valStr:t.val,d:daysUntil(t.val),nome:getName(t.funcId)})),
  ].sort((a,b)=>a.d-b.d);

  html+=`<div class="sec-title"><i class="ti ti-bell"></i>Alertas</div>`;
  if(!urgentes.length){
    html+=`<div class="card"><div style="padding:24px;text-align:center;color:#9ca3af;font-size:13px"><i class="ti ti-circle-check" style="font-size:36px;display:block;margin-bottom:8px;color:#40916c"></i>Tudo em ordem!</div></div>`;
  } else {
    html+=`<div class="card"><div style="padding:4px 0">`;
    urgentes.slice(0,6).forEach(u=>{
      const s=statusOf(u.valStr);
      html+=`<div class="alert-item">
        <div class="alert-dot ${s.cls}"><i class="ti ${s.cls==='red'?'ti-alert-circle':'ti-clock'}"></i></div>
        <div><div class="alert-msg"><strong>${u.nome}</strong> — ${u.tipo||u.modulo}</div>
        <div class="alert-type">${u.modulo} · ${fmtD(u.valStr)} · <span class="badge ${s.cls}" style="padding:1px 6px;font-size:10px">${s.txt}</span></div></div>
      </div>`;
    });
    html+=`</div></div>`;
  }
  document.getElementById('page-dashboard').innerHTML=html;
}

function updateBell(){
  const exames=load(K.e);const epis=load(K.p);const treins=load(K.t);
  const count=exames.filter(e=>daysUntil(e.val)<=30).length+epis.filter(e=>daysUntil(e.rep)<=30).length+treins.filter(t=>daysUntil(t.val)<=30).length;
  const el=document.getElementById('bell-count');
  el.textContent=count>9?'9+':count;
  el.style.display=count?'flex':'none';
}

// Init
document.getElementById('fab-btn').style.display='none';
renderDashboard();
updateBell();
</script>
</body>
</html>
